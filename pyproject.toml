[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warpTemplate"
version = "0.1.0"
description = "Warped SN time series templates and correction models for sncosmo."
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["supernova", "sncosmo", "time series", "templates", "warp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "astropy>=5.1",
    "sncosmo>=2.0",
    "extinction>=0.4",
    "matplotlib>=3.7",
    "pandas>=1.5",
    "skysurvey>=0.31,<0.32",
    "pyarrow>=10",
    "h5py>=3.8"
]

[project.optional-dependencies]
classification = [
    "scikit-learn>=1.1",
    "lightgbm>=3.3",
    "lcdata>=1.1",
    "torch>=2.0",
    "seaborn>=0.12",
    "jupyterlab>=4",
    "supernnova>=3.0"
]

[tool.setuptools]
packages = ["warpTemplate", "warpTemplate.config"]

[tool.setuptools.package-dir]
warpTemplate = "."

[tool.setuptools.package-data]
warpTemplate = ["config/*.json"]
